name: storyqito_app
description: "Flutter app for sharing stories with images and location"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # shared_preferences
  shared_preferences: ^2.5.3

  # network
  http: ^1.3.0
  http_parser: ^4.1.2

  # state management
  provider: ^6.1.4

  equatable: ^2.0.7

  # splash screen
  flutter_native_splash: ^2.4.6

  intl: ^0.19.0
  url_launcher: ^6.3.0
  path: ^1.9.1

  # camera and image picker
  image_picker: ^1.1.2
  camera: ^0.11.1

  # ui
  dropdown_button2: ^2.3.9
  lottie: ^3.3.1
  readmore: ^3.0.0

  # google maps
  google_maps_flutter: ^2.12.1
  google_maps_flutter_web: ^0.5.12
  google_maps_flutter_android: ^2.16.1
  geolocator: ^14.0.0

  # code generation
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0

  # environment
  flutter_dotenv: ^5.2.1
  universal_html: ^2.2.4

  #info app
  package_info_plus: ^8.3.0

  pointer_interceptor: ^0.10.1+2

  # router
  go_router: ^15.1.2

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/storyqito-logo.png
  color_dark: "#121212"
  image_dark: assets/icon/storyqito-logo.png

  android_12:
    image: assets/icon/storyqito-logo.png
    icon_background_color: "#ffffff"
    image_dark: assets/icon/storyqito-logo.png
    icon_background_color_dark: "#121212"

  web: true

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  freezed: ^3.0.6

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icon/
    - assets/flag/
    - assets/animation/
    - assets/.env

  fonts:
    - family: Quicksand
      fonts:
        - asset: fonts/Quicksand-Bold.ttf
          weight: 700
        - asset: fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: fonts/Quicksand-Light.ttf
          weight: 300
